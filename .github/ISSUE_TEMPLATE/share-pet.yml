name: Share a pet
description: Introduce an imaginary friend pet for the Miantuan Pets gallery.
title: "[pet] "
labels: ["pet-submission"]
body:
  - type: input
    id: owner
    attributes:
      label: Owner / 归属
      description: Name the imaginary friend's owner or the character's rights holder, separately from its reference source.
      placeholder: "Xiaoyan / 小焰, @your-name, or a character owner"
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Reference source / 参考来源
      description: Name the work, character, childhood memory, or original concept behind the appearance. Include a public link if available.
      placeholder: "Genshin Impact / 原神, childhood memory / 童年记忆"
    validations:
      required: true
  - type: input
    id: shared-by
    attributes:
      label: Sharing credit / 分享者
      description: Optional name or public handle of the person sharing or adapting this pet.
  - type: input
    id: pet-id
    attributes:
      label: Pet id
      description: Lowercase letters, numbers, and hyphens.
      placeholder: "my-soft-friend"
    validations:
      required: true
  - type: textarea
    id: intro
    attributes:
      label: Bilingual introduction
      description: Add English and Chinese if possible.
    validations:
      required: true
  - type: textarea
    id: forms
    attributes:
      label: Forms or states
      description: Describe important forms, states, or transformations.
    validations:
      required: true
  - type: textarea
    id: assets
    attributes:
      label: Pet files or links
      description: Attach pet.json, spritesheet.webp, previews, or a repository link.
    validations:
      required: true
  - type: checkboxes
    id: public
    attributes:
      label: Public sharing
      options:
        - label: I only included material I am comfortable making public.
          required: true
